name: DevOps CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run automated tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t agile-assignment2-app:latest .

      - name: Deploy application with Docker Compose
        run: docker compose up -d --build

      - name: Smoke test deployed application
        run: |
          for i in $(seq 1 15); do
            if curl --fail http://localhost:5002/health; then
              echo "Deployment health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Deployment health check failed"
          docker compose logs
          exit 1

      - name: Verify application response
        run: |
          curl --fail http://localhost:5002/ | tee response.json
          grep -q "Application running successfully" response.json

      - name: Clean up test deployment
        if: always()
        run: docker compose down
